{% extends 'frontend/base.html' %}
{% block title %}Giriş{% endblock %}
{% block reserve_cta %}{% endblock %}
{% block content %}
<section class="max-w-md mx-auto">
	<article class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 shadow-sm">
		<header class="mb-6 text-center space-y-2">
			<h2 class="text-2xl font-semibold" id="login-heading">Kullanıcı Girişi</h2>
			<p class="text-sm text-gray-500 dark:text-gray-400">Standart kullanıcı ve yönetici girişleri ayrı tutulur.</p>
		</header>
		<div class="flex gap-2 mb-4">
			<button id="login-tab-user" class="flex-1 px-3 py-2 rounded border border-blue-600 text-blue-600 font-semibold">Kullanıcı</button>
			<button id="login-tab-admin" class="flex-1 px-3 py-2 rounded border border-gray-300 dark:border-gray-700 text-gray-500">Yönetici</button>
		</div>
		<form id="login-form" class="space-y-4" data-mode="user">
			<label class="block">
				<span class="text-sm font-medium">Kullanıcı adı</span>
				<input name="username" required class="mt-1 w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="kullaniciadi" />
			</label>
			<label class="block">
				<span class="text-sm font-medium">Şifre</span>
				<input name="password" type="password" required class="mt-1 w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="••••••••" />
			</label>
			<button type="submit" class="w-full px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Giriş</button>
		</form>
		<p id="login-msg" class="text-sm text-center mt-3 text-gray-600 dark:text-gray-300"></p>
		<p class="text-sm text-center mt-2 text-gray-500 dark:text-gray-400">Hesabın yok mu? <a class="text-blue-600 hover:underline" href="/register/">Kayıt ol</a></p>
	</article>
</section>
{% endblock %}
{% block scripts %}
<script>
const form = document.getElementById('login-form');
const tabUser = document.getElementById('login-tab-user');
const tabAdmin = document.getElementById('login-tab-admin');
const heading = document.getElementById('login-heading');
const loginMsg = document.getElementById('login-msg');
const endpoints = {
	user: '/api/auth/user-token/',
	admin: '/api/auth/admin-token/'
};
const redirects = {
	user: '/',
	admin: '/admin-panel/'
};

function switchMode(mode){
	form.dataset.mode = mode;
	if(mode === 'admin'){
		tabAdmin.classList.replace('border-gray-300', 'border-blue-600');
		tabAdmin.classList.replace('text-gray-500', 'text-blue-600');
		tabAdmin.classList.add('font-semibold');
		tabUser.classList.remove('font-semibold');
		tabUser.classList.replace('border-blue-600', 'border-gray-300');
		tabUser.classList.replace('text-blue-600', 'text-gray-500');
		heading.textContent = 'Yönetici Girişi';
	}else{
		tabUser.classList.replace('border-gray-300', 'border-blue-600');
		tabUser.classList.replace('text-gray-500', 'text-blue-600');
		tabUser.classList.add('font-semibold');
		tabAdmin.classList.remove('font-semibold');
		tabAdmin.classList.replace('border-blue-600', 'border-gray-300');
		tabAdmin.classList.replace('text-blue-600', 'text-gray-500');
		heading.textContent = 'Kullanıcı Girişi';
	}
	loginMsg.textContent = '';
}

tabUser.addEventListener('click', (e)=>{ e.preventDefault(); switchMode('user'); });
tabAdmin.addEventListener('click', (e)=>{ e.preventDefault(); switchMode('admin'); });

form.addEventListener('submit', async (e) => {
	e.preventDefault();
	const mode = form.dataset.mode || 'user';
	const formData = new FormData(form);
	const payload = { username: formData.get('username'), password: formData.get('password') };
	try{
		const res = await window.libmApi(endpoints[mode], { method:'POST', body: JSON.stringify(payload) });
		const data = await res.json();
		if (res.ok) {
			localStorage.setItem('access', data.access);
			localStorage.setItem('refresh', data.refresh);
			localStorage.setItem('userRole', data.role || (mode === 'admin' ? 'admin' : 'user'));
			loginMsg.textContent = 'Giriş başarılı, yönlendiriliyorsunuz...';
			window.location.href = redirects[mode];
		} else {
			loginMsg.textContent = data.detail || 'Giriş başarısız';
			window.showToast(data.detail || 'Giriş başarısız', 'error');
		}
	}catch(err){
		window.showToast('Sunucuya ulaşılamıyor', 'error');
	}
});

switchMode('user');
</script>
{% endblock %}
