{% extends 'frontend/base.html' %}
{% block title %}Kayıt{% endblock %}
{% block reserve_cta %}{% endblock %}
{% block content %}
<section class="max-w-md mx-auto">
	<article class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 shadow-sm">
		<header class="mb-6 text-center">
			<h2 class="text-2xl font-semibold">Kayıt Ol</h2>
		</header>
		<form id="register-form" class="space-y-4">
			<label class="block">
				<span class="text-sm font-medium">Kullanıcı adı</span>
				<input name="username" required class="mt-1 w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="kullaniciadi" />
				<p class="text-xs text-red-600 mt-1 hidden" id="error-username"></p>
				<p class="text-xs text-gray-500 mt-1">En az 3 karakter, sadece harf, rakam ve alt çizgi</p>
			</label>
			<label class="block">
				<span class="text-sm font-medium">E-posta</span>
				<input name="email" type="email" class="mt-1 w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="ornek@mail.com" />
				<p class="text-xs text-red-600 mt-1 hidden" id="error-email"></p>
				<p class="text-xs text-gray-500 mt-1">Geçerli bir e-posta adresi girin</p>
			</label>
			<label class="block">
				<span class="text-sm font-medium">Şifre</span>
				<input name="password" type="password" required class="mt-1 w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800" placeholder="••••••••" />
				<p class="text-xs text-red-600 mt-1 hidden" id="error-password"></p>
				<p class="text-xs text-gray-500 mt-1">En az 8 karakter</p>
			</label>
			<button type="submit" class="w-full px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Kayıt Ol</button>
		</form>
		<p id="register-msg" class="text-sm text-center mt-3 text-gray-600 dark:text-gray-300"></p>
		<p class="text-sm text-center mt-2 text-gray-500 dark:text-gray-400">Zaten hesabın var mı? <a class="text-blue-600 hover:underline" href="/login/">Giriş yap</a></p>
	</article>
</section>
{% endblock %}
{% block scripts %}
<script>
function clearErrors() {
	document.getElementById('error-username').classList.add('hidden');
	document.getElementById('error-email').classList.add('hidden');
	document.getElementById('error-password').classList.add('hidden');
	document.getElementById('error-username').textContent = '';
	document.getElementById('error-email').textContent = '';
	document.getElementById('error-password').textContent = '';
}

function showError(field, message) {
	const errorEl = document.getElementById(`error-${field}`);
	errorEl.textContent = message;
	errorEl.classList.remove('hidden');
}

const regForm = document.getElementById('register-form');
regForm.addEventListener('submit', async (e) => {
	e.preventDefault();
	clearErrors();
	
	const fd = new FormData(regForm);
	const payload = { username: fd.get('username'), email: fd.get('email'), password: fd.get('password') };
	
	try{
		const res = await window.libmApi('/api/users/register/', { method:'POST', body: JSON.stringify(payload) });
		const data = await res.json();
		if (res.ok) {
			document.getElementById('register-msg').textContent = 'Kayıt başarılı, giriş sayfasına yönlendiriliyorsunuz';
			setTimeout(() => window.location.href = '/login/', 700);
		} else {
			// Handle validation errors
			if (data.username) {
				showError('username', Array.isArray(data.username) ? data.username[0] : data.username);
			}
			if (data.email) {
				showError('email', Array.isArray(data.email) ? data.email[0] : data.email);
			}
			if (data.password) {
				showError('password', Array.isArray(data.password) ? data.password[0] : data.password);
			}
			if (data.detail && !data.username && !data.email && !data.password) {
				document.getElementById('register-msg').textContent = data.detail;
			}
			window.showToast('Kayıt başarısız', 'error');
		}
	}catch(err){ 
		window.showToast('Sunucuya ulaşılamıyor', 'error'); 
	}
});
</script>
{% endblock %}
